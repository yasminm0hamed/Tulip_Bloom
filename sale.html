<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Special Offers & Sale - Flower Store</title>
    
    <!-- CSS Files -->
    <link rel="stylesheet" href="roses.css">
    <link rel="stylesheet" href="popup.css">
    
    <!-- Icons & Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kaushan+Script&display=swap" rel="stylesheet">
</head>
<body>

    <h1>Sale</h1>

    <!-- Sale Items Grid -->
    <div class="items">
        <!-- Item 1 -->
        <div class="item" 
             data-title="Yellow Lilies"
             data-price="$20"
             data-desc="Fresh Yellow lilies with elegant wrapping."
             data-img="imeges/li2.png">
            <i class="fa-solid fa-heart heart"></i>
            <img src="imeges/li2.png" alt="Yellow Lilies">
            <p>Yellow Lilies</p>
            <div>
                <p class="view">View More</p>
                <div>
                    <del>40$</del><span>20$</span>
                </div>
            </div>
        </div>

        <!-- Item 2 -->
        <div class="item" 
             data-title="Lavender Bouquet"
             data-price="$20"
             data-desc="Fresh Lavender Bouquet with elegant wrapping."
             data-img="imeges/boq2.png">
            <i class="fa-solid fa-heart heart"></i>
            <img src="imeges/boq2.png" alt="Lavender Bouquet">
            <p>Lavender Bouquet</p>
            <div>
                <p class="view">View More</p>
                <div>
                    <del>40$</del><span>20$</span>
                </div>
            </div>
        </div>

        <!-- Item 3 -->
        <div class="item" 
             data-title="Pink Rose"
             data-price="$20"
             data-desc="Fresh Pink Rose with elegant wrapping."
             data-img="imeges/rose3.png">
            <i class="fa-solid fa-heart heart"></i>
            <img src="imeges/rose3.png" alt="Pink Rose">
            <p>Pink Rose</p>
            <div>
                <p class="view">View More</p>
                <div>
                    <del>40$</del><span>20$</span>
                </div>
            </div>
        </div>

        <!-- Item 4 -->
        <div class="item" 
             data-title="Pink Lilies"
             data-price="$20"
             data-desc="Fresh Pink Lilies with elegant wrapping."
             data-img="imeges/li4.png">
            <i class="fa-solid fa-heart heart"></i>
            <img src="imeges/li4.png" alt="Pink Lilies">
            <p>Pink Lilies</p>
            <div>
                <p class="view">View More</p>
                <div>
                    <del>40$</del><span>20$</span>
                </div>
            </div>
        </div>

        <!-- Item 5 -->
        <div class="item" 
             data-title="Red Lilies"
             data-price="$20"
             data-desc="Fresh Red Lilies with elegant wrapping."
             data-img="imeges/li3.png">
            <i class="fa-solid fa-heart heart"></i>
            <img src="imeges/li3.png" alt="Red Lilies">
            <p>Red Lilies</p>
            <div>
                <p class="view">View More</p>
                <div>
                    <del>40$</del><span>20$</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Product Modal / Popup -->
    <div class="popup" id="popup">
        <div class="popup-content">
            <span class="close">&times;</span>
            <img id="popup-img" alt="Product Image">
            <h2 id="popup-title"></h2>
            <p id="popup-price"></p>
            <p id="popup-desc"></p>
            <div class="quantity">
                <button id="minus">-</button>
                <span id="count">1</span>
                <button id="plus">+</button>
            </div>
            <button class="add-to-cart-btn">Add To Cart</button>
        </div>
    </div>

    <!-- JavaScript Files -->
    <script src="products.js"></script>
    <script src="store.js"></script>
    <script src="popup.js"></script>
</body>
</html>
