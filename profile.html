<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile | Tulip Bloom</title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <link rel="stylesheet" href="profile.css">
    <style>
     body{
            height: 100vh;
            overflow-y: hidden;
        }
        #fav{
            overflow-y: auto;
        }
        footer{
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top:1px solid rgb(211, 210, 210);
            position:fixed;
            bottom: 0;
            width: 100%;
            z-index: 1000;
            background-color: var(--back-ground);
        }
        footer .fitem {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 10px 0;
        width: 20%;

        }

        footer .fitem p {
        margin: 4px 0 0 0;
        color: #373333;
        font-weight: bold;
        font-size: 12px;
        }
        footer .fitem a{
            color: rgb(55, 51, 51); 
            font-size: 20px;
        }
        footer .fitem.active{
        border-top:3px solid var(--alt-color) 
        }
        footer .fitem.active i,
        footer .fitem.active p{
            color:var(--alt-color);
            
        }
    </style>
</head>

<body>

    <main class="profile-page">

        <section class="profile-card">

            <div class="profile-header">

                <span class="small-title">
                    TULIP BLOOM
                </span>

                <h1>My Profile</h1>

                <p>
                    Welcome back to your little garden.
                </p>

            </div>


            <div class="profile-image-container">

                <img
                    id="profileImage"
                    src=""
                    alt="Profile Picture"
                >

            </div>


            <h2 id="userName">User Name</h2>

            <p class="user-email" id="userEmail">
                user@email.com
            </p>


            <div class="profile-info">

                <div class="info-title">
                    <i class="fa-regular fa-user"></i>
                    <span>Personal Information</span>
                </div>


                <div class="info-item">

                    <span class="label">
                        Full Name
                    </span>

                    <span id="infoName">
                        --
                    </span>

                </div>


                <div class="info-item">

                    <span class="label">
                        Email
                    </span>

                    <span id="infoEmail">
                        --
                    </span>

                </div>

            </div>


            <div class="profile-actions">

                <button class="edit-btn" id="editProfile">
                    <i class="fa-regular fa-pen-to-square"></i>
                    Edit Profile
                </button>

                <button class="logout-btn" id="logout">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    Logout
                </button>

            </div>


            <a href="store.html" class="back-store">
                <i class="fa-solid fa-arrow-left"></i>
                Back to Store
            </a>

        </section>

    </main>
    <footer>
            <div class="fitem ">
                <a href="store.html" class="f"><i class="fa-solid fa-house"></i></a>
                <p class="f">home</p>
            </div>
            <div class="fitem  ">
                <a href="fav.html" class="f"><i class="fa-regular fa-heart"></i></a>
                <p class="f">wishlist</p>
            </div>
            
            <div class="fitem ">
                <a href="cart.html" class="f"><i class="fa-solid fa-cart-shopping"></i></a>
                <p class="f">cart</p>
            </div>
            <div class="fitem active">
                <a href="profile.html" class="f"><i class="fa-solid fa-user"></i></a>
                <p class="f">profile</p>
            </div>
    </footer>


    <script src="profile.js"></script>

</body>

</html>
