<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roses - Flower Store</title>
    
    <!-- CSS Links -->
    <link rel="stylesheet" href="roses.css">
    <link rel="stylesheet" href="popup.css">
    
    <!-- Icons & Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kaushan+Script&display=swap" rel="stylesheet">
</head>
<body>

    <h1>Roses Section</h1>

    <div class="items">
        <div class="item" 
             data-title="Yellow Rose"
             data-price="$40"
             data-desc="Fresh Yellow Rose with elegant wrapping."
             data-img="imeges/rose2.png">
            <i class="fa-solid fa-heart heart"></i>
            <img src="imeges/rose2.png" alt="Yellow Rose">
            <p>Yellow Rose</p>
            <div>
                <p class="view">View More</p>
                <p>$40</p>
            </div>
        </div>

        <div class="item" 
             data-title="Purple Tulip"
             data-price="$40"
             data-desc="Fresh Purple Tulip with elegant wrapping."
             data-img="imeges/rose1.png">
            <i class="fa-solid fa-heart heart"></i>
            <img src="imeges/rose1.png" alt="Purple Tulip">
            <p>Purple Tulip</p>
            <div>
                <p class="view">View More</p>
                <p>$40</p>
            </div>
        </div>

        <div class="item" 
             data-title="Pink Flower"
             data-price="$40"
             data-desc="Fresh Pink Flower with elegant wrapping."
             data-img="imeges/rose3.png">
            <i class="fa-solid fa-heart heart"></i>
            <img src="imeges/rose3.png" alt="Pink Flower">
            <p>Pink Flower</p>
            <div>
                <p class="view">View More</p>
                <p>$40</p>
            </div>
        </div>

        <div class="item" 
             data-title="Red Flower"
             data-price="$40"
             data-desc="Fresh Red Flower with elegant wrapping."
             data-img="imeges/rose4.png">
            <i class="fa-solid fa-heart heart"></i>
            <img src="imeges/rose4.png" alt="Red Flower">
            <p>Red Flower</p>
            <div>
                <p class="view">View More</p>
                <p>$40</p>
            </div>
        </div>

        <div class="item" 
             data-title="Pink Rose"
             data-price="$40"
             data-desc="Fresh Pink Rose with elegant wrapping."
             data-img="imeges/rose5.png">
            <i class="fa-solid fa-heart heart"></i>
            <img src="imeges/rose5.png" alt="Pink Rose">
            <p>Pink Rose</p>
            <div>
                <p class="view">View More</p>
                <p>$40</p>
            </div>
        </div>

        <div class="item" 
             data-title="White Flower"
             data-price="$40"
             data-desc="Fresh White Flower with elegant wrapping."
             data-img="imeges/rose6.png">
            <i class="fa-solid fa-heart heart"></i>
            <img src="imeges/rose6.png" alt="White Flower">
            <p>White Flower</p>
            <div>
                <p class="view">View More</p>
                <p>$40</p>
            </div>
        </div>
    </div>

    <!-- Popup Section -->
    <div class="popup" id="popup">
        <div class="popup-content">
            <span class="close">&times;</span>
            <img id="popup-img" src="" alt="Popup Image">
            <h2 id="popup-title"></h2>
            <p id="popup-price"></p>
            <p id="popup-desc"></p>
            <div class="quantity">
                <button id="minus">-</button>
                <span id="count">1</span>
                <button id="plus">+</button>
            </div>
            <button class="add-to-cart-btn">Add To Cart</button>
        </div>
    </div>

    <!-- Scripts -->
    <script src="products.js"></script>
    <script src="popup.js"></script>
    <script src="store.js"></script>
</body>
</html>
